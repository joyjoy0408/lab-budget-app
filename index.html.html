        // Global State Manager
        let appState = {};

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    appState = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse localStorage data, resetting', e);
                    appState = JSON.parse(JSON.stringify(initialData));
                }
            } else {
                appState = JSON.parse(JSON.stringify(initialData));
                saveState();
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }

        function logAudit(action, details) {
            const userObj = appState.users[appState.currentRole];
            const logEntry = {
                timestamp: new Date().toLocaleString('ko-KR', { hour12: false }),
                user: userObj.name,
                role: userObj.title,
                ip: '127.0.0.1 (Local Session)',
                action: action,
                details: details
            };
            appState.auditLogs.unshift(logEntry);
            if (appState.auditLogs.length > 100) appState.auditLogs.pop(); // limit to 100
            saveState();
        }

        function formatKRW(val) {
            if (val === null || val === undefined || isNaN(val)) return '0원';
            return Math.round(val).toLocaleString('ko-KR') + '원';
        }

        function getDept(code) {
            return appState.departments.find(d => d.code === code) || { name: code, baseBudget: 0 };
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-slate-900 border-l-4 border-emerald-500 text-white' : 'bg-red-900 border-l-4 border-red-500 text-white';
            toast.className = `p-4 rounded shadow-xl flex items-center space-x-3 text-sm transform transition-all duration-300 translate-y-2 opacity-0 ${bgClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation text-red-400'} text-lg"></i>
                <div class="font-medium">${message}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        ];

        function renderNavTabs() {
            const container = document.getElementById('nav-tabs');
            container.innerHTML = '';

            tabsConfig.forEach(tab => {
                // Permission Check
                if (!tab.roles.includes(appState.currentRole)) return;

                const isActive = currentTab === tab.id;
                const btn = document.createElement('button');
                btn.onclick = () => switchTab(tab.id);
                btn.className = `flex items-center px-4 py-2.5 rounded-lg font-semibold text-sm transition-all whitespace-nowrap ${
                    isActive 
                    ? 'bg-brand-600 text-white shadow-sm' 
                    : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                }`;
                btn.innerHTML = `<i class="fa-solid ${tab.icon} me-2 text-base"></i>${tab.label}`;
                container.appendChild(btn);
            });
        }

        function switchTab(tabId) {
            currentTab = tabId;
            renderNavTabs();
            renderContent();
        }

        function switchRole(role) {
            appState.currentRole = role;
            const user = appState.users[role];
            document.getElementById('current-user-name').textContent = `${user.name} ${user.title}`;
            document.getElementById('current-dept-name').textContent = user.deptName;

            logAudit('역할 변경', `사용자 역할을 [${user.title}] (으)로 스위칭하였습니다.`);
            saveState();

            // Fallback tab if current tab is restricted
            const currentTabObj = tabsConfig.find(t => t.id === currentTab);
            if (!currentTabObj.roles.includes(role)) {
                currentTab = 'dashboard';
            }

            renderNavTabs();
            renderContent();
            showToast(`[${user.title}] 권한 모드로 전환되었습니다.`);
        }

        function changeYear(year) {
            appState.academicYear = year;
            saveState();
            renderContent();
            showToast(`${year}학년도 데이터 기준으로 변경되었습니다.`);
        }

                    renderLabExpenseView(container);
                    break;
                case 'equipment':
                    renderEquipmentView(container);
                    break;
                case 'baseline':
                    renderBaselineView(container);
                    break;
                case 'review':
                    renderReviewView(container);
                    break;
                case 'export':
                    renderExportView(container);
                    break;
                case 'admin-code':
                    renderAdminCodeView(container);
                    break;
                case 'audit-log':
                    renderAuditLogView(container);
                    break;
                case 'user-profile':
                    renderUserProfileView(container);
                    break;

        function calculateItemBudget() {
            const unit = parseInt(document.getElementById('modal-unitCost').value) || 0;
            const qty = parseInt(document.getElementById('modal-quantity').value) || 0;
            const freq = parseInt(document.getElementById('modal-frequency').value) || 1;

            const calcTotal = unit * qty * freq;
            document.getElementById('modal-budgetAmount').value = calcTotal;
            document.getElementById('modal-calculationDetail').value = `${formatKRW(unit)} × ${qty}개 × ${freq}회`;
            verifyMathMismatch();
        }

        function verifyMathMismatch() {
            const unit = parseInt(document.getElementById('modal-unitCost').value) || 0;
            const qty = parseInt(document.getElementById('modal-quantity').value) || 0;
            const freq = parseInt(document.getElementById('modal-frequency').value) || 1;
            const budget = parseInt(document.getElementById('modal-budgetAmount').value) || 0;

            const warning = document.getElementById('math-warning');
            if (unit * qty * freq !== budget) {
                warning.classList.remove('hidden');
            } else {
                warning.classList.add('hidden');
            }
        }

        function submitExpenseItemForm(e) {
            e.preventDefault();
            const role = appState.currentRole;
            const user = appState.users[role];
            const deptCode = (role === 'ROLE_DEPT_STAFF' || role === 'ROLE_DEPT_HEAD') ? user.deptCode : 'CS';
            const year = appState.academicYear;

            const app = appState.labExpenseApps.find(a => a.deptCode === deptCode && a.academicYear === year);

            const fileInput = document.getElementById('modal-file');
            const fileName = fileInput.files.length > 0 ? fileInput.files[0].name : '기초견적서.pdf';

            const newItem = {
                id: 'item-' + Date.now(),
                businessType: document.getElementById('modal-businessType').value,
                supportCategory: document.getElementById('modal-supportCategory').value,
                subCategory: document.getElementById('modal-subCategory').value,
                nationalProgram: document.getElementById('modal-nationalProgram').value || '-',
                courseName: document.getElementById('modal-courseName').value,
                targetClass: document.getElementById('modal-targetClass').value,
                professor: document.getElementById('modal-professor').value,
                period: document.getElementById('modal-period').value,
                content: document.getElementById('modal-content').value,
                expectedEffect: document.getElementById('modal-expectedEffect').value || '-',
                unitCost: parseInt(document.getElementById('modal-unitCost').value) || 0,
                quantity: parseInt(document.getElementById('modal-quantity').value) || 0,
                frequency: parseInt(document.getElementById('modal-frequency').value) || 1,
                budgetAmount: parseInt(document.getElementById('modal-budgetAmount').value) || 0,
                calculationDetail: document.getElementById('modal-calculationDetail').value,
                fileName: fileName
            };

            app.items.push(newItem);
            app.updatedAt = new Date().toLocaleString('ko-KR');
            saveState();
            closeModal();
            renderContent();
            logAudit('신청 항목 추가', `실험실습비 [${newItem.courseName}] 항목 (${formatKRW(newItem.budgetAmount)}) 추가`);

                                    ${app.items.map(item => `
                                        <tr>
                                            <td class="border border-slate-900 p-2">${item.businessType}</td>

        // ------------------------------------------

        // ------------------------------------------
        // 4.8. AUDIT LOG VIEW
        // ------------------------------------------
        function renderAuditLogView(container) {
            const logs = appState.auditLogs;

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <h2 class="text-xl font-bold text-slate-900">시스템 변경 이력 (Audit Trail Log)</h2>
                        <p class="text-xs text-slate-500 mt-1">예산 수치 수정, 확정, 보완요청 등 모든 트랜잭션의 추적 로그 기록입니다.</p>
                    </div>

                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-xs text-left">
                                <thead class="bg-slate-100 text-slate-700 font-bold uppercase border-b border-slate-200">
                                    <tr>
                                        <th class="p-3">일시</th>
                                        <th class="p-3">작업자</th>

                                            <td class="p-3 font-bold text-slate-900">${log.user}</td>
                                            <td class="p-3 text-slate-600">${log.role}</td>
                                            <td class="p-3 text-slate-400 font-mono">${log.ip}</td>
                                            <td class="p-3"><span class="px-2 py-0.5 rounded font-bold bg-slate-100 text-slate-800">${log.action}</span></td>

                                        </tr>

                            </table>

                    </div>
                </div>

        // ------------------------------------------
        // 4.9. USER PROFILE VIEW
        // ------------------------------------------
        function renderUserProfileView(container) {
            const role = appState.currentRole;
            const user = appState.users[role];

            container.innerHTML = `
                <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <div class="flex items-center space-x-4 border-b border-slate-200 pb-6">
                        <div class="w-16 h-16 rounded-full bg-brand-600 text-white font-bold text-2xl flex items-center justify-center shadow-lg">
                            ${user.name.charAt(0)}
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">${user.name} ${user.title}</h2>
                            <p class="text-xs text-brand-600 font-bold mt-0.5">${user.deptName} 소속</p>
                            <p class="text-xs text-slate-400 mt-1">현재 활성화된 역할 권한: <span class="font-mono text-slate-700 font-semibold">${role}</span></p>
                        </div>
                    </div>

                    <div class="space-y-4 text-xs">
                        <h3 class="font-bold text-sm text-slate-900">사용자 권한 명세 안내</h3>
                        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2 text-slate-700">
                            <p>• <span class="font-bold">ROLE_DEPT_STAFF:</span> 학과 신청서 작성, 임시 저장, 세부 항목 및 증빙파일 첨부 권한</p>
                            <p>• <span class="font-bold">ROLE_DEPT_HEAD:</span> 학과 작성안 검토 및 대학 예산팀으로의 제출 권한</p>
                            <p>• <span class="font-bold">ROLE_ADMIN_BUDGET:</span> 전 학과 신청서 검토, 보완 요청(반려), 최종 확정(CONFIRMED) 승인 권한</p>
                            <p>• <span class="font-bold">ROLE_SYSTEM_ADMIN:</span> 전체 시스템 스위칭, 코드, 이력 관리 권한</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 5. APPLICATION INITIALIZATION
        // ==========================================
        window.onload = function() {
            loadState();
            renderNavTabs();
            renderContent();
            // Sync initial switcher select UI
            document.getElementById('role-switcher').value = appState.currentRole;
            const user = appState.users[appState.currentRole];
            document.getElementById('current-user-name').textContent = `${user.name} ${user.title}`;
            document.getElementById('current-dept-name').textContent = user.deptName;
        };
    </script>
</body>
